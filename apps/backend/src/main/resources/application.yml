server:
  port: 8080

spring:
  application:
    name: taskflow-backend

  datasource:
    url: jdbc:h2:mem:taskflowdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics