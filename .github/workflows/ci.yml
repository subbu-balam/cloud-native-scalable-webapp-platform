name: TaskFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend - Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        working-directory: apps/backend
        run: mvn test

      - name: Build backend JAR
        working-directory: apps/backend
        run: mvn package -DskipTests

  frontend:
    name: Frontend - React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t taskflow-backend:test ./apps/backend

      - name: Build frontend Docker image
        run: docker build -t taskflow-frontend:test ./apps/frontend



  publish-images:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-backend:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-frontend:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-frontend:${{ github.sha }}
